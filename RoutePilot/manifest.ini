[ABOUT]
NAME = RoutePilot
AUTHOR = Ashna-X1
VERSION = 0.3.3
DESCRIPTION = Wall-aware drift AI. Takes over any AI-controlled car (Ctrl+8 for the player car), scans the track boundaries once at start (raycasts + spline sides), drives a high-speed wheelspin drift line away from walls. No fast lane or route needed. Crash-safe text log.
REQUIRED_VERSION = 0

[CORE]
LAZY = NONE

[WINDOW_MAIN]
ID = main
NAME = RoutePilot
FUNCTION_MAIN = windowMain
SIZE = 360, 560
MIN_SIZE = 320, 480
